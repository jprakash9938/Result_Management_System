services:
  - type: web
    name: student-result-management
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/student-result-management-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: result-postgres-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: result-postgres-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: result-postgres-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: result-postgres-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: result-postgres-db
          property: password
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: result-postgres-db
    databaseName: result_db
    user: result_user
    plan: free
